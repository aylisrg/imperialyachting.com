# Preview instance: new.imperialyachting.com -> 127.0.0.1:3001 (vps-deploy.sh --preview).
# Install: sudo cp deploy/nginx-preview.conf /etc/nginx/sites-available/new.imperialyachting.com
#          sudo ln -s ../sites-available/new.imperialyachting.com /etc/nginx/sites-enabled/
#          sudo cp deploy/nginx-videos.conf /etc/nginx/snippets/imperial-videos.conf
#          sudo nginx -t && sudo systemctl reload nginx
# TLS: after DNS "new" resolves, run: sudo certbot --nginx -d new.imperialyachting.com
#      certbot adds the 443 server and the http->https redirect to this file itself.
server {
    listen 80;
    listen [::]:80;
    server_name new.imperialyachting.com;

    # Same clips as prod, same location block (/srv/imperialyachting/videos/).
    include /etc/nginx/snippets/imperial-videos.conf;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
