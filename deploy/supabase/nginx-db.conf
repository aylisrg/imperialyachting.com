# db.imperialyachting.com -> kong (127.0.0.1:8000). TLS added by certbot --nginx.
# Install: sudo cp deploy/supabase/nginx-db.conf /etc/nginx/sites-available/db.imperialyachting.com
server {
    listen 80;
    listen [::]:80;
    server_name db.imperialyachting.com;

    client_max_body_size 500m;   # yacht videos / sales media uploads

    # Only the APIs the app uses. Studio, pg-meta (/pg/) and the rest stay closed.
    location / { return 404; }

    location ~ ^/(rest|auth|storage)/v1/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }
}
