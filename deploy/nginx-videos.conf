# Home page clips live outside git. Upload them to /srv/imperialyachting/videos/
# with their original names; nginx serves them (Range requests work out of the box).
location /videos/ {
    alias /srv/imperialyachting/videos/;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Accept-Ranges bytes;
    types { video/mp4 mp4; video/webm webm; image/jpeg jpg; }
}
