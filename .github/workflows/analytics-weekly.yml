name: Weekly Analytics Report

on:
  schedule:
    # Every Monday at 08:00 UTC (12:00 Dubai time)
    - cron: '0 8 * * 1'
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions UI

jobs:
  collect-and-analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify required secrets
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          ANALYTICS_CRON_SECRET: ${{ secrets.ANALYTICS_CRON_SECRET }}
        run: |
          missing=0
          for name in SITE_URL ANALYTICS_CRON_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is empty or not set — the analytics pipeline cannot run. Add it in Settings → Secrets and variables → Actions."
              missing=1
            fi
          done
          case "$SITE_URL" in
            "" | http://* | https://*) ;;
            *)
              echo "::error::Secret SITE_URL must be an absolute URL including the scheme, e.g. https://imperialyachting.com"
              missing=1
              ;;
          esac
          [ "$missing" = "0" ] || exit 1

      - name: Trigger analytics pipeline
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST \
            "${{ secrets.SITE_URL }}/api/analytics/collect" \
            -H "Authorization: Bearer ${{ secrets.ANALYTICS_CRON_SECRET }}" \
            -H "Content-Type: application/json")

          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | head -n -1)

          echo "HTTP Status: $http_code"
          echo "Response: $body"

          if [ "$http_code" != "200" ]; then
            echo "::error::Analytics pipeline failed with status $http_code"
            exit 1
          fi
