name: Daily Ads Report

on:
  schedule:
    # Every day at 06:00 UTC (10:00 Dubai time) — late enough that Meta has
    # settled the previous day's attribution.
    - cron: '0 6 * * *'
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions UI

jobs:
  collect-and-analyze:
    runs-on: ubuntu-latest
    # The MCP tool loop runs server-side and can take a few minutes.
    timeout-minutes: 10

    steps:
      - name: Trigger ads pipeline
        run: |
          response=$(curl -s --max-time 540 -w "\n%{http_code}" -X POST \
            "${{ secrets.SITE_URL }}/api/ads/collect" \
            -H "Authorization: Bearer ${{ secrets.ANALYTICS_CRON_SECRET }}" \
            -H "Content-Type: application/json")

          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | head -n -1)

          echo "HTTP Status: $http_code"
          echo "Response: $body"

          if [ "$http_code" != "200" ]; then
            echo "::error::Ads pipeline failed with status $http_code"
            exit 1
          fi
