name: Booking Cron

# Backup trigger for the booking cron routes.
# The live site is nginx on the Finnish server, not Vercel. vercel.json
# crons apply only while a Vercel deployment is still receiving traffic.
# This workflow is a backstop and needs secrets SITE_URL and
# BOOKING_CRON_SECRET; it has been disabled manually when those were empty.
# Do not delete vercel.json until systemd timers for the same routes are
# committed and enabled (see DEPLOY.md).

on:
  schedule:
    # Expire stale quotes/holds every 15 minutes.
    - cron: '*/15 * * * *'
    # Balance reminders once a day.
    - cron: '0 6 * * *'
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions UI

jobs:
  expire-holds:
    if: github.event.schedule == '*/15 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Expire stale quotes/holds
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST \
            "${{ secrets.SITE_URL }}/api/cron/expire-holds" \
            -H "Authorization: Bearer ${{ secrets.BOOKING_CRON_SECRET }}" \
            -H "Content-Type: application/json")

          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | head -n -1)

          echo "HTTP Status: $http_code"
          echo "Response: $body"

          if [ "$http_code" != "200" ]; then
            echo "::error::expire-holds cron failed with status $http_code"
            exit 1
          fi

  balance-reminders:
    if: github.event.schedule == '0 6 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send balance payment reminders
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST \
            "${{ secrets.SITE_URL }}/api/cron/balance-reminders" \
            -H "Authorization: Bearer ${{ secrets.BOOKING_CRON_SECRET }}" \
            -H "Content-Type: application/json")

          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | head -n -1)

          echo "HTTP Status: $http_code"
          echo "Response: $body"

          if [ "$http_code" != "200" ]; then
            echo "::error::balance-reminders cron failed with status $http_code"
            exit 1
          fi
